name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    # macos-15 ships Xcode 16 / Swift 6 by default, which swift-tools-version 6.0 requires.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  lint:
    name: SwiftFormat (lint)
    runs-on: macos-15
    # Informational only — formatting drift should not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Lint
        run: swiftformat --lint .
