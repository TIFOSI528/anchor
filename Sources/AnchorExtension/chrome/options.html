<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Anchor 扩展设置</title>
  <style>
    body { font: 14px -apple-system, system-ui, sans-serif; padding: 24px; max-width: 420px; }
    h1 { font-size: 18px; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 120px; padding: 4px 6px; }
    .status { margin-top: 16px; padding: 8px 12px; border-radius: 6px; background: #f3f4f6; }
    .ok { color: #16a34a; }
    .off { color: #9ca3af; }
    button { margin-top: 12px; padding: 6px 14px; }
  </style>
</head>
<body>
  <h1>⚓︎ Anchor 扩展</h1>
  <p>把当前标签页地址同步给本机 Anchor app。只连 <code>127.0.0.1</code>，不发往任何服务器。</p>

  <label for="port">本机端口</label>
  <input id="port" type="number" min="1" max="65535" />
  <button id="save">保存</button>

  <div class="status">连接状态：<span id="status" class="off">未知</span></div>

  <script src="options.js"></script>
</body>
</html>
