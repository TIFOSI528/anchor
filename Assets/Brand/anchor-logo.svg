<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>Anchor logo</title>
  <desc>Anchor — 桅杆上的瞭望员。一根隐形的橡皮筋。</desc>

  <!-- Background pill shaped like Dynamic Island -->
  <rect x="40" y="100" width="160" height="40" rx="20" fill="#0f172a"/>

  <!-- Anchor symbol -->
  <g fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ring at top -->
    <circle cx="120" cy="115" r="5"/>
    <!-- vertical shaft -->
    <line x1="120" y1="120" x2="120" y2="138"/>
    <!-- horizontal arms -->
    <line x1="108" y1="124" x2="132" y2="124"/>
    <!-- curved bottom -->
    <path d="M 104 132 Q 120 144 136 132" stroke-width="3"/>
    <!-- arrow tips -->
    <path d="M 100 130 L 104 132 L 104 128" fill="#22c55e"/>
    <path d="M 140 130 L 136 132 L 136 128" fill="#22c55e"/>
  </g>

  <!-- subtle green LED dot (the "we are in green zone" signal) -->
  <circle cx="180" cy="120" r="3" fill="#22c55e">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
