<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>Anchor</title>
  <desc>Anchor — 一根隐形的橡皮筋，系在你和你的任务之间。</desc>
  <!-- macOS 圆角方块底 + 与菜单栏 StatusBarIcon 同几何的锚形 -->
  <rect x="8" y="8" width="224" height="224" rx="52" fill="#0F172A"/>
  <g fill="none" stroke="#22C55E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- 顶部圆环 -->
    <circle cx="120" cy="56" r="19"/>
    <!-- 竖杆 -->
    <line x1="120" y1="75" x2="120" y2="200"/>
    <!-- 横杆 -->
    <line x1="80" y1="102" x2="160" y2="102"/>
    <!-- 底部锚臂（过底点的圆弧） -->
    <path d="M 54 138 A 66 66 0 0 0 186 138"/>
  </g>
</svg>
