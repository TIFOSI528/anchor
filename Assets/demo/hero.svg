<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro', 'PingFang SC', sans-serif">
  <title>Anchor 三幕演示</title>
  <desc>绿区时刘海旁一个呼吸绿点；漂移时岛从刘海展开为倒计时圆环；单击后拉回收起。</desc>

  <!-- 舞台 -->
  <rect width="1280" height="420" rx="28" fill="#0B1220"/>
  <!-- 屏幕顶部条带（菜单栏暗示） -->
  <rect x="28" y="24" width="1224" height="46" rx="10" fill="#101B2E"/>
  <!-- 左侧抽象菜单（中性占位，避免真实桌面噪声） -->
  <g fill="#3B475C">
    <rect x="56" y="42" width="34" height="10" rx="5"/>
    <rect x="102" y="42" width="52" height="10" rx="5"/>
    <rect x="166" y="42" width="44" height="10" rx="5"/>
  </g>
  <!-- 右侧抽象状态图标 -->
  <g fill="#3B475C">
    <circle cx="1124" cy="47" r="6"/>
    <circle cx="1152" cy="47" r="6"/>
    <circle cx="1180" cy="47" r="6"/>
    <rect x="1198" y="40" width="26" height="14" rx="4"/>
  </g>

  <!-- 硬件刘海（屏幕顶部中央） -->
  <path d="M 460 24 H 820 V 52 Q 820 70 802 70 H 478 Q 460 70 460 52 Z" fill="#000000"/>

  <!-- 幕一/三：刘海左侧的呼吸绿点（漂移期间隐藏） -->
  <g>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
             values="1;0;1" keyTimes="0;0.25;0.76"/>
    <circle cx="436" cy="47" r="7" fill="#22C55E">
      <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.35;1;0.35"/>
    </circle>
  </g>

  <!-- 幕二：从刘海长出的岛（与刘海严格等宽） -->
  <g>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
             values="0;1;0" keyTimes="0;0.25;0.755"/>
    <path d="M 460 24 H 820 V 116 Q 820 136 800 136 H 480 Q 460 136 460 116 Z" fill="#000000">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
               values="M 460 24 H 820 V 52 Q 820 70 802 70 H 478 Q 460 70 460 52 Z;
                       M 460 24 H 820 V 52 Q 820 70 802 70 H 478 Q 460 70 460 52 Z;
                       M 460 24 H 820 V 116 Q 820 136 800 136 H 480 Q 460 136 460 116 Z;
                       M 460 24 H 820 V 116 Q 820 136 800 136 H 480 Q 460 136 460 116 Z;
                       M 460 24 H 820 V 52 Q 820 70 802 70 H 478 Q 460 70 460 52 Z;
                       M 460 24 H 820 V 52 Q 820 70 802 70 H 478 Q 460 70 460 52 Z"
               keyTimes="0;0.25;0.285;0.73;0.762;1"/>
    </path>

    <!-- 岛内内容：圆环 + 倒计时（仅幕二可见） -->
    <g>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.285;0.31;0.71;0.74;1"/>
      <!-- 倒计时圆环：橙色，顺时针填充 -->
      <circle cx="600" cy="102" r="15" fill="none" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="4"/>
      <circle cx="600" cy="102" r="15" fill="none" stroke="#F59E0B" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="94.2" transform="rotate(-90 600 102)">
        <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite"
                 values="94.2;94.2;94.2;14;14;94.2" keyTimes="0;0.25;0.30;0.71;0.75;1"/>
      </circle>
      <!-- 跳动的计时文本 -->
      <g font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start" style="font-variant-numeric: tabular-nums">
        <text x="632" y="111" font-family="ui-monospace, 'SF Mono', monospace">0:40
          <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
                   values="0;1;0;0" keyTimes="0;0.30;0.44;1"/>
        </text>
        <text x="632" y="111" font-family="ui-monospace, 'SF Mono', monospace" opacity="0">0:41
          <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
                   values="0;1;0;0" keyTimes="0;0.44;0.58;1"/>
        </text>
        <text x="632" y="111" font-family="ui-monospace, 'SF Mono', monospace" opacity="0">0:42
          <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
                   values="0;1;0;0" keyTimes="0;0.58;0.74;1"/>
        </text>
      </g>
    </g>
  </g>

  <!-- 幕三：单击脉冲 -->
  <circle cx="640" cy="100" r="8" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0">
    <animate attributeName="r" dur="10s" repeatCount="indefinite"
             values="8;8;8;30;8" keyTimes="0;0.70;0.705;0.75;1"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
             values="0;0;0.9;0;0" keyTimes="0;0.70;0.71;0.75;1"/>
  </circle>

  <!-- 字幕（三幕轮换） -->
  <g font-size="30" text-anchor="middle" fill="#E2E8F0">
    <text x="640" y="248" opacity="0">绿区 · 几乎隐形——一个呼吸点守在刘海旁
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
               values="1;0;1" keyTimes="0;0.24;0.97"/>
    </text>
    <text x="640" y="248" opacity="0">漂移 · 岛从刘海展开，圆环开始倒计时
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.27;0.69"/>
    </text>
    <text x="640" y="248" opacity="0">单击 · 立刻拉回刚才的工作（&lt; 200ms）
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.70;0.96"/>
    </text>
  </g>

  <!-- 三幕进度点 -->
  <g>
    <circle cx="604" cy="300" r="5" fill="#22C55E">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
               values="1;0.25;1" keyTimes="0;0.25;0.76"/>
    </circle>
    <circle cx="640" cy="300" r="5" fill="#F59E0B">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
               values="0.25;1;0.25" keyTimes="0;0.25;0.70"/>
    </circle>
    <circle cx="676" cy="300" r="5" fill="#60A5FA">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete"
               values="0.25;1;0.25" keyTimes="0;0.70;0.97"/>
    </circle>
  </g>

  <!-- 底部品牌一句话 -->
  <text x="640" y="368" font-size="22" text-anchor="middle" fill="#64748B">一根隐形的橡皮筋，系在你和你的任务之间</text>
</svg>
